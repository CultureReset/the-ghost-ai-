<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet Console</title>
<!-- No CDN. This console is opened on a dock office laptop and on the box
     itself; a stylesheet that has to reach the internet is a console that
     is blank on exactly the day the network is the problem. Plex is used
     when the machine already has it and the system stack otherwise. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230E1113'/%3E%3Ccircle cx='8' cy='8' r='3' fill='%23E8A33D'/%3E%3C/svg%3E">
<style>
  :root{
    --ground:#0E1113; --panel:#161A1D; --panel-2:#1D2327; --rail:#111517;
    --ink:#E6EAE8; --ink-2:#A9B5B2; --muted:#75837F;
    --line:#242B2F; --line-2:#323B40;
    --amber:#E8A33D;   /* needs you */
    --ok:#4FB286; --bad:#E06C5A; --warn:#D9A441; --info:#6C9CE0;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--ground);color:var(--ink);
    font-family:"IBM Plex Sans","Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.45;
    -webkit-font-smoothing:antialiased}
  .mono{font-family:"IBM Plex Mono",ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace}

  /* ---------- masthead ---------- */
  header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    padding:14px 20px;border-bottom:1px solid var(--line);background:var(--rail)}
  .brand{font-weight:700;letter-spacing:.16em;font-size:12px;text-transform:uppercase}
  .brand b{color:var(--amber)}
  header .now{margin-left:auto;font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:11px;
    color:var(--muted)}
  header .now button{background:none;border:1px solid var(--line-2);color:var(--ink-2);
    font:inherit;padding:3px 9px;border-radius:3px;cursor:pointer;margin-left:10px}
  header .now button:hover{border-color:var(--amber);color:var(--amber)}

  /* ---------- summary ---------- */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));
    gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
  .tile{background:var(--panel);padding:12px 16px}
  .tile .n{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:1.85rem;font-weight:600;
    line-height:1;font-variant-numeric:tabular-nums}
  .tile .l{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);margin-top:6px}
  .tile.hot{background:#1E1710}
  .tile.hot .n{color:var(--amber)}
  .tile.bad .n{color:var(--bad)}

  /* ---------- tabs ---------- */
  nav{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--line);
    background:var(--rail);scrollbar-width:thin;
    scrollbar-color:var(--line-2) transparent}
  nav::-webkit-scrollbar{height:3px}
  nav::-webkit-scrollbar-thumb{background:var(--line-2)}
  nav button{flex:0 0 auto;background:none;border:0;border-bottom:2px solid transparent;
    color:var(--muted);font:inherit;font-weight:500;padding:11px 16px;cursor:pointer;
    white-space:nowrap}
  nav button:hover{color:var(--ink)}
  nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--amber)}
  nav button .c{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:11px;
    color:var(--muted);margin-left:7px}
  nav button[aria-selected="true"] .c{color:var(--amber)}

  main{padding:18px 20px 60px}
  .lede{color:var(--ink-2);font-size:13px;max-width:76ch;margin-bottom:16px}
  .lede b{color:var(--ink);font-weight:600}

  /* ---------- table ---------- */
  .wrap{overflow-x:auto;border:1px solid var(--line);border-radius:3px;background:var(--panel)}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{text-align:left;padding:9px 13px;border-bottom:1px solid var(--line);
    vertical-align:top}
  thead th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);font-weight:600;background:var(--panel-2);
    border-bottom:1px solid var(--line-2);white-space:nowrap;position:sticky;top:0}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--panel-2)}
  td.m{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12px;white-space:nowrap}
  td.num{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;text-align:right;
    font-variant-numeric:tabular-nums}
  .sev{border-left:3px solid transparent}
  .sev.hi{border-left-color:var(--bad)}
  .sev.md{border-left-color:var(--amber)}
  .sev.lo{border-left-color:var(--line-2)}

  .pill{display:inline-block;font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:10px;
    font-weight:600;letter-spacing:.06em;padding:2px 7px;border-radius:2px;
    white-space:nowrap;border:1px solid}
  .p-ok  {color:var(--ok);   border-color:#1E4034; background:#132520}
  .p-bad {color:var(--bad);  border-color:#48241E; background:#251512}
  .p-warn{color:var(--warn); border-color:#443417; background:#241D10}
  .p-info{color:var(--info); border-color:#1F3350; background:#121B29}
  .p-dim {color:var(--muted);border-color:var(--line-2)}

  button.act{background:none;border:1px solid var(--line-2);color:var(--ink-2);
    font:inherit;font-size:12px;padding:4px 10px;border-radius:3px;cursor:pointer}
  button.act:hover{border-color:var(--amber);color:var(--amber)}
  button.act.go:hover{border-color:var(--ok);color:var(--ok)}
  button.act.no:hover{border-color:var(--bad);color:var(--bad)}
  button.act+button.act{margin-left:6px}

  .empty{padding:34px 16px;text-align:center;color:var(--muted);font-size:13px}
  .empty b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:6px;font-weight:600}
  .tree{color:var(--muted)}
</style>
</head>
<body>

<header>
  <span class="brand">A NEXT<b>&nbsp;</b>GENT &middot; Fleet Console</span>
  <span class="now"><span id="stamp">—</span><button id="refresh">Refresh</button></span>
</header>

<div class="tiles" id="tiles"></div>
<nav id="tabs"></nav>
<main id="view"></main>

<script>
// Every tab's badge is the number of rows behind it. A badge that counts
// something narrower than the table it opens is a badge that lies.
const VIEWS = [
  ["drift",        "Drift"],
  ["approvals",    "Approvals"],
  ["fleet",        "Fleet"],
  ["inconsistent", "Inconsistent"],
  ["actions",      "Actions"],
  ["businesses",   "Entities"],
  ["content",      "Content"],
  ["edit",         "Edit"],
];
let DATA = {}, CURRENT = "drift";

const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const pill = (t, k) => `<span class="pill p-${k}">${esc(t)}</span>`;
// "today" is the wrong resolution for a fleet. A box last seen four hours ago
// and a box last seen four minutes ago are two different Tuesdays.
const ago = s => { if(!s) return "never";
  const m = Math.floor((Date.now() - new Date(s.replace(" ","T")+"Z")) / 60000);
  if (m < 1)    return "just now";
  if (m < 60)   return m + " min";
  if (m < 1440) return Math.floor(m/60) + " hr";
  const d = Math.floor(m/1440);
  return d === 1 ? "1 day" : d + " days"; };

function tiles(s){
  const t = [
    ["drift_unfixed","drift unfixed",  s.drift_unfixed > 0 ? "hot" : ""],
    ["approvals",    "need your OK",   s.approvals    > 0 ? "hot" : ""],
    ["contradicted", "contradicted",   s.contradicted > 0 ? "bad" : ""],
    ["boxes_down",   "boxes unwell",   s.boxes_down   > 0 ? "bad" : ""],
    ["boxes",        "boxes",          ""],
    ["businesses",   "businesses",     ""],
    ["failed_today", "failed 24h",     s.failed_today > 0 ? "bad" : ""],
    ["denied_today", "you said no 24h", ""],
  ];
  document.getElementById("tiles").innerHTML = t.map(([k, l, c]) =>
    `<div class="tile ${c}"><div class="n">${s[k] ?? 0}</div><div class="l">${l}</div></div>`
  ).join("");
}

function tabs(){
  document.getElementById("tabs").innerHTML = VIEWS.map(([k, label]) => {
    // Edit is a form, not a list -- a count beside it would be counting nothing.
    const n = k === "edit" ? 0 : (DATA[k]?.length ?? 0);
    return `<button data-v="${k}" aria-selected="${k === CURRENT}">${label}` +
           (n ? `<span class="c">${n}</span>` : "") + `</button>`;
  }).join("");
  document.querySelectorAll("nav button").forEach(b =>
    b.onclick = () => { CURRENT = b.dataset.v; tabs(); render(); });
}

const table = (cols, body) =>
  `<div class="wrap"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead>
   <tbody>${body}</tbody></table></div>`;

const empty = (h, p) => `<div class="empty"><b>${h}</b>${p}</div>`;

function render(){
  const v = document.getElementById("view");
  const d = DATA[CURRENT] || [];

  if (CURRENT === "drift") {
    v.innerHTML = `<p class="lede">An app or a vendor changed and something
      <b>refused to act</b> rather than guessing. Nothing was written. Re-map once
      here and every box has the fix.</p>` +
      (d.length ? table(
        ["", "What changed", "Capability", "Map written for", "Seen out there",
         "Hits", "Businesses", "First seen", "State", ""],
        d.map(r => {
          const sev = r.businesses > 3 ? "hi" : r.businesses > 0 ? "md" : "lo";
          return `<tr class="sev ${sev}"><td></td>
            <td><b>${esc(r.subject)}</b><br><span class="pill p-dim">${esc(r.kind)}</span></td>
            <td class="m">${esc(r.capability || "—")}</td>
            <td class="m">${esc(r.expected || "—")}</td>
            <td class="m">${esc(r.seen || "—")}</td>
            <td class="num">${r.occurrences}</td>
            <td class="num">${r.businesses}</td>
            <td class="m">${ago(r.first_seen_at)}</td>
            <td>${pill(r.state, r.state === "open" ? "bad" : "warn")}</td>
            <td><button class="act" onclick="setDrift('${r.id}','mapping')">Re-mapping</button>
                <button class="act go" onclick="setDrift('${r.id}','fixed')">Fixed</button></td>
          </tr>`;
        }).join(""))
        : empty("Nothing drifted", "Every map matches what is on the devices."));

  } else if (CURRENT === "approvals") {
    v.innerHTML = `<p class="lede">Held because the capability is risky or the
      business's constitution says a person decides. <b>Nothing runs until you
      answer.</b></p>` +
      (d.length ? table(["Business", "Capability", "Arguments", "Asked by", "Waiting", ""],
        d.map(r => `<tr class="sev md">
          <td>${esc(r.business || "—")}</td>
          <td class="m">${esc(r.capability)}</td>
          <td class="m">${esc(r.args)}</td>
          <td>${esc(r.requested_by || "—")}</td>
          <td class="m">${ago(r.requested_at)}</td>
          <td><button class="act go" onclick="decide('${r.id}','approve')">Approve</button>
              <button class="act no" onclick="decide('${r.id}','deny')">Deny</button></td>
        </tr>`).join(""))
        : empty("Nothing waiting", "No action is held for a person."));

  } else if (CURRENT === "fleet") {
    v.innerHTML = `<p class="lede">Every box, what it is running and when it last
      spoke. <b>A box that has gone quiet is the one to look at</b> — it cannot
      tell you it is broken.</p>` +
      (d.length ? table(["Box", "Business", "OS", "Channel", "Content", "Health", "Last seen"],
        d.map(r => {
          const k = { ok:"ok", degraded:"warn", down:"bad", unknown:"dim" }[r.health];
          return `<tr class="sev ${r.health==="down"?"hi":r.health==="ok"?"lo":"md"}">
            <td><b>${esc(r.label || r.id)}</b><br><span class="mono" style="font-size:11px;color:var(--muted)">${esc(r.serial || "")}</span></td>
            <td>${esc(r.business || "—")}</td>
            <td class="m">${esc(r.os_version || "—")}</td>
            <td class="m">${esc(r.channel)}</td>
            <td class="m">${esc(r.content || "—")}</td>
            <td>${pill(r.health, k)}</td>
            <td class="m">${ago(r.last_seen_at)}</td></tr>`;
        }).join(""))
        : empty("No boxes enrolled", "Nothing has been provisioned yet."));

  } else if (CURRENT === "inconsistent") {
    v.innerHTML = `<p class="lede">Where a business's surfaces disagree with what
      it believes is true. <b>A contradiction is two competing realities</b> and
      the customer is reading one of them.</p>` +
      (d.length ? table(["Business", "Field", "Should be", "Surface", "Actually says", "Verdict", "Checked"],
        d.map(r => `<tr class="sev ${r.verdict === "CONTRADICTED" ? "hi" : "md"}">
          <td>${esc(r.business || r.entity_id)}</td>
          <td class="m">${esc(r.field)}</td>
          <td class="m">${esc(r.canonical_value ?? "—")}</td>
          <td class="m">${esc(r.surface)}</td>
          <td class="m">${esc(r.observed ?? "—")}</td>
          <td>${pill(r.verdict, r.verdict === "CONTRADICTED" ? "bad" : "dim")}</td>
          <td class="num">${r.days_stale ?? "—"}d</td></tr>`).join(""))
        : empty("Everything agrees", "No surface contradicts a canonical value."));

  } else if (CURRENT === "actions") {
    v.innerHTML = `<p class="lede">Both dimensions of state. <b>Finished is not a
      result</b> — the verdict beside it is. A denial is shown as a denial, not
      as a failure: nothing was attempted and nothing broke.</p>` +
      (d.length ? table(["Action", "Business", "Capability", "Lifecycle", "Verification", "Surfaces", "When"],
        d.map(r => {
          const k = { VERIFIED:"ok", PARTIALLY_VERIFIED:"warn", CONTRADICTED:"bad",
                      FAILED:"bad", NOT_YET_VERIFIABLE:"dim" }[r.verification] || "dim";
          const sev = r.denied ? "lo" : k==="bad" ? "hi" : k==="warn" ? "md" : "lo";
          return `<tr class="sev ${sev}">
            <td class="m">${esc(r.id)}</td>
            <td>${esc(r.business || "—")}</td>
            <td class="m">${esc(r.capability)}</td>
            <td>${pill(r.lifecycle, r.lifecycle === "FINISHED" ? "dim" : "info")}</td>
            <td>${r.denied ? pill("DENIED", "dim")
                            : r.verification ? pill(r.verification, k) : "—"}</td>
            <td class="num">${r.surfaces_ok ?? 0}/${r.surfaces_total ?? 0}</td>
            <td class="m">${ago(r.requested_at)}</td></tr>`;
        }).join(""))
        : empty("No actions yet", "Nothing has been requested."));

  } else if (CURRENT === "businesses") {
    v.innerHTML = `<p class="lede">The entity graph. <b>A business is not one
      row</b> — each operating unit owns or inherits its own hours, prices and
      availability.</p>` +
      (d.length ? table(["Name", "Kind", "Vertical", "Units", "Boxes", "Apps"],
        d.map(r => `<tr class="sev lo">
          <td>${r.depth ? `<span class="tree">${"\u00a0\u00a0".repeat(r.depth - 1)}└─ </span>` : ""}<b>${esc(r.name)}</b></td>
          <td>${pill(r.kind, "dim")}</td>
          <td class="m">${esc(r.vertical || "—")}</td>
          <td class="num">${r.children}</td>
          <td class="num">${r.devices}</td>
          <td class="num">${r.apps}</td></tr>`).join(""))
        : empty("No businesses", "Nothing enrolled yet."));


  } else if (CURRENT === "edit") {
    v.innerHTML = renderEdit();
    wireEdit();

  } else if (CURRENT === "content") {
    v.innerHTML = `<p class="lede">Maps in the field. <b>A candidate never runs
      against a customer</b> — promotion is deliberate.</p>` +
      (d.length ? table(["App", "App version", "Map", "Capability", "Executor", "State", "Runs", "Not OK"],
        d.map(r => `<tr class="sev ${r.bad > 0 ? "md" : "lo"}">
          <td class="m">${esc(r.subject)}</td>
          <td class="m">${esc(r.app_version)}</td>
          <td class="num">v${r.map_version}</td>
          <td class="m">${esc(r.capability)}</td>
          <td class="m">${esc(r.executor)}</td>
          <td>${pill(r.state, r.state === "promoted" ? "ok" : r.state === "canary" ? "warn" : "dim")}</td>
          <td class="num">${r.runs}</td>
          <td class="num">${r.bad}</td></tr>`).join(""))
        : empty("No maps recorded", "Nothing has run yet."));
  }
}


/* ------------------------------------------------------------------ editor
 * The write half. Everything here posts to /api/edit/* and then reloads, so
 * what you see after a save is what the database actually holds -- never the
 * optimistic copy the form was holding, which is how an edit that silently
 * failed still looks saved.
 */
let EDSEL = null;   // entity being edited
const E = () => DATA.editable || {};
const ents = () => (E().entities || []);
const cur = () => ents().find(e => e.id === EDSEL) || ents()[0] || null;
const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

function renderEdit(){
  const e = cur();
  return `<p class="lede">Everything a person is allowed to change by hand.
    <b>What you type is recorded as something you said</b>, not as the final
    answer &mdash; the resolver still weighs it against what the apps and the
    public pages report. Facts the system produced about itself (a heartbeat, a
    verdict, a serial) are not editable here at all.</p>
  <div class="ed">
    <div class="edlist">
      ${ents().map(x => `<button data-ed="${x.id}" aria-selected="false"
         aria-current="${x.id === (e && e.id)}">
         ${x.parent_id ? '<span class="tree2">└ </span>' : ""}${esc(x.name)}
         <span class="sub">${esc(x.kind)}${x.vertical ? " · " + esc(x.vertical) : ""}</span>
       </button>`).join("")}
      <button data-ed="__new" aria-current="${EDSEL === "__new"}">
        + New business<span class="sub">parent, operation or unit</span></button>
    </div>
    <div>${EDSEL === "__new" ? panelEntity(null) : (e ? [
        panelEntity(e), panelAddress(e), panelHours(e), panelMenu(e),
        panelBoxes(e)
      ].join("") : `<div class="panel"><h3>No businesses yet</h3>
        <p class="why">Add one on the left.</p></div>`)}</div>
  </div>`;
}

const field = (k, label, val, extra = "") =>
  `<div><label for="f_${k}">${esc(label)}</label>
   <input id="f_${k}" value="${esc(val ?? "")}" ${extra}></div>`;

function panelEntity(e){
  const opts = (sel) => `<option value="">— none (top level) —</option>` +
    ents().filter(x => !e || x.id !== e.id)
      .map(x => `<option value="${x.id}" ${x.id === sel ? "selected" : ""}>
        ${esc(x.name)}</option>`).join("");
  return `<div class="panel" id="p_ent">
    <h3>${e ? "Business" : "New business"}</h3>
    <p class="why">A business is not one row. Flora-Bama owns a marina, the
      marina runs dolphin cruises &mdash; each one addressable, each one able to
      own or inherit its own hours and prices.</p>
    <div class="fields">
      ${field("name", "Name", e && e.name)}
      <div><label for="f_kind">Kind</label><select id="f_kind">
        ${["parent","location","operation","unit"].map(k =>
          `<option ${e && e.kind === k ? "selected" : ""}>${k}</option>`).join("")}
      </select></div>
      <div><label for="f_vertical">Vertical</label><select id="f_vertical">
        <option value="">— none —</option>
        ${["restaurant","charter","marina","trades","artist"].map(k =>
          `<option ${e && e.vertical === k ? "selected" : ""}>${k}</option>`).join("")}
      </select></div>
      <div><label for="f_parent">Sits under</label>
        <select id="f_parent">${opts(e && e.parent_id)}</select></div>
    </div>
    <div class="row2">
      <button class="act go" onclick="saveEntity('${e ? e.id : ""}')">
        ${e ? "Save" : "Create"}</button>
      ${e ? `<button class="act no" onclick="delEntity('${e.id}')">Delete</button>` : ""}
      <span class="note" id="n_ent"></span>
    </div></div>`;
}

function panelAddress(e){
  return `<div class="panel">
    <h3>Address</h3>
    <p class="why">Where it is. The shell puts this under the business name and
      a directory listing needs it.</p>
    <div class="fields">
      ${field("line1", "Street", e.line1)}
      ${field("city", "City", e.city)}
      ${field("region", "State", e.region)}
      ${field("postal", "ZIP", e.postal)}
    </div>
    <div class="row2"><button class="act go" onclick="saveAddress('${e.id}')">Save</button>
      <span class="note" id="n_addr"></span></div></div>`;
}

function panelHours(e){
  const mine = (E().hours || []).filter(h => h.entity_id === e.id);
  const get = wd => mine.find(h => h.weekday === wd);
  return `<div class="panel">
    <h3>Hours</h3>
    <p class="why">Closing after midnight is normal here &mdash; a closing time
      earlier than the opening time means the next morning, not a mistake.</p>
    <div class="week">${DAYS.map((d, i) => { const h = get(i); return `
      <div class="wk">
        <span class="d">${d}</span>
        <input id="o_${i}" value="${esc(h ? h.opens : "")}" placeholder="11:00">
        <input id="c_${i}" value="${esc(h ? h.closes : "")}" placeholder="02:00">
        <label style="display:flex;gap:6px;align-items:center;text-transform:none;
          letter-spacing:0;font-size:12px;margin:0;color:var(--ink-2)">
          <input type="checkbox" id="x_${i}" ${h ? "" : "checked"}
            style="width:auto"> closed</label>
      </div>`; }).join("")}</div>
    <div class="row2"><button class="act go" onclick="saveHours('${e.id}')">Save the week</button>
      <span class="note" id="n_hours"></span></div></div>`;
}

function panelMenu(e){
  const secs = (E().sections || []).filter(s => s.entity_id === e.id);
  const items = (E().items || []).filter(i => i.entity_id === e.id);
  return `<div class="panel">
    <h3>Menu</h3>
    <p class="why">86ing an item takes effect immediately and asks nobody.
      It is the one thing that has to work in two seconds on a Friday night.</p>
    ${secs.map(s => `<div style="margin-bottom:16px">
      <div style="font-weight:600;font-size:13px;margin-bottom:6px">${esc(s.name)}</div>
      ${items.filter(i => i.section_id === s.id).map(i => `<div class="itemrow">
        <input value="${esc(i.name)}" id="in_${i.id}">
        <input value="${i.price_cents == null ? "" : (i.price_cents/100).toFixed(2)}"
          id="ip_${i.id}" placeholder="0.00">
        <button class="act ${i.available ? "" : "no"}"
          onclick="toggle86('${i.id}', ${i.available ? 0 : 1})">
          ${i.available ? "86 it" : "86'd"}</button>
        <button class="act" onclick="saveItem('${i.id}')">Save</button>
      </div>`).join("") || `<div class="note">No items.</div>`}
      <div class="itemrow" style="margin-top:8px">
        <input id="new_${s.id}" placeholder="Add an item…">
        <input id="newp_${s.id}" placeholder="0.00">
        <span></span>
        <button class="act go" onclick="addItem('${s.id}')">Add</button>
      </div></div>`).join("")}
    <div class="row2">
      <input id="newsec" placeholder="New section (Starters, Raw Bar…)"
        style="max-width:260px">
      <button class="act" onclick="addSection('${e.id}')">Add section</button>
      <span class="note" id="n_menu"></span></div></div>`;
}

function panelBoxes(e){
  const mine = (E().devices || []);
  return `<div class="panel">
    <h3>Boxes</h3>
    <p class="why">You can say which business a box belongs to, what to call it
      and which channel it follows. <b>Serial, version and health are not
      editable</b> &mdash; the box writes those about itself, and a fleet you can
      type into tells you what somebody meant to deploy.</p>
    ${mine.map(d => `<div class="itemrow" style="grid-template-columns:minmax(0,1fr) 150px 110px 90px">
      <input id="dl_${d.id}" value="${esc(d.label || "")}" placeholder="Where it sits">
      <select id="de_${d.id}">
        <option value="">— unassigned —</option>
        ${ents().map(x => `<option value="${x.id}" ${x.id === d.entity_id ? "selected" : ""}>
          ${esc(x.name)}</option>`).join("")}</select>
      <select id="dc_${d.id}">${["stable","beta","canary"].map(c =>
        `<option ${d.channel === c ? "selected" : ""}>${c}</option>`).join("")}</select>
      <button class="act" onclick="saveDevice('${d.id}')">Save</button>
     </div>
     <div class="note" style="margin:0 0 12px">
       ${esc(d.serial || "no serial")} · ${esc(d.os_version || "?")} ·
       ${pill(d.health, {ok:"ok",degraded:"warn",down:"bad"}[d.health] || "dim")}
     </div>`).join("") || `<div class="note">No boxes enrolled. On the box:
       <span class="mono">python3 -m fleet.report --db node.sqlite --enroll</span></div>`}
    <span class="note" id="n_dev"></span></div>`;
}

function wireEdit(){
  document.querySelectorAll("[data-ed]").forEach(b =>
    b.onclick = () => { EDSEL = b.dataset.ed; render(); });
}

const val = id => (document.getElementById(id) || {}).value;
async function post(path, body, noteId){
  const n = document.getElementById(noteId);
  try{
    const r = await fetch("/api/edit/" + path,
      { method:"POST", body: JSON.stringify(body) });
    const d = await r.json();
    if(!r.ok){ if(n){ n.className="note bad"; n.textContent = d.error; } return null; }
    if(n){ n.className="note ok"; n.textContent = "Saved."; }
    return d;
  }catch(err){
    if(n){ n.className="note bad"; n.textContent = String(err); }
    return null;
  }
}

async function saveEntity(id){
  const d = await post("entity", { id: id || undefined, name: val("f_name"),
    kind: val("f_kind"), vertical: val("f_vertical") || null,
    parent_id: val("f_parent") || null }, "n_ent");
  if(d){ EDSEL = d.id; await load(); }
}
async function delEntity(id){
  const d = await post("entity/del", { id }, "n_ent");
  if(d){ EDSEL = null; await load(); }
}
async function saveAddress(id){
  if(await post("location", { entity_id:id, line1:val("f_line1"),
    city:val("f_city"), region:val("f_region"), postal:val("f_postal") }, "n_addr"))
    await load();
}
async function saveHours(id){
  const days = DAYS.map((_, i) => document.getElementById("x_"+i).checked
    ? { weekday:i, closed:true }
    : { weekday:i, opens:val("o_"+i), closes:val("c_"+i) });
  if(await post("hours", { entity_id:id, days }, "n_hours")) await load();
}
async function addSection(id){
  const name = val("newsec"); if(!name) return;
  if(await post("menu/section", { entity_id:id, name }, "n_menu")) await load();
}
async function addItem(sid){
  const name = val("new_"+sid); if(!name) return;
  const p = val("newp_"+sid);
  if(await post("menu/item", { section_id:sid, name,
      price_cents: p ? Math.round(parseFloat(p)*100) : null }, "n_menu"))
    await load();
}
async function saveItem(id){
  const p = val("ip_"+id);
  if(await post("menu/item", { id, name: val("in_"+id),
      price_cents: p ? Math.round(parseFloat(p)*100) : null }, "n_menu"))
    await load();
}
async function toggle86(id, to){
  if(await post("menu/item", { id, available: to }, "n_menu")) await load();
}
async function saveDevice(id){
  if(await post("device", { id, label: val("dl_"+id),
      entity_id: val("de_"+id) || null, channel: val("dc_"+id) }, "n_dev"))
    await load();
}

async function load(){
  const r = await fetch("/api/all");
  DATA = await r.json();
  tiles(DATA.summary || {});
  tabs(); render();
  document.getElementById("stamp").textContent =
    new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}
async function setDrift(id, state){
  await fetch("/api/drift/state", { method:"POST",
    body: JSON.stringify({ id, state }) });
  load();
}
async function decide(id, decision){
  await fetch("/api/approval", { method:"POST",
    body: JSON.stringify({ id, decision, by: "console" }) });
  load();
}
document.getElementById("refresh").onclick = load;
load();
setInterval(load, 30000);
</script>
</body>
</html>
